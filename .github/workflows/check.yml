name: Checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wrtix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --show-trace
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zstd file curl
      - name: Build signed architecture-independent APK
        run: python3 ci/build-package.py --work "$RUNNER_TEMP/sdk-build" --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-apk
          path: artifacts/*
          if-no-files-found: error
  vm:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-25.12-apk
          path: artifacts
      - name: Install official VM test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 e2fsprogs openssh-client python3-yaml curl
      - name: Accept SDK package and transaction lifecycle
        run: python3 tests/vm/package_acceptance.py --artifacts artifacts --directory "$RUNNER_TEMP/wrtix-vm"
      - uses: actions/upload-artifact@v4
        with:
          name: official-openwrt-acceptance
          path: ${{ runner.temp }}/wrtix-vm/summary.json
          if-no-files-found: error
      - name: Retain non-secret VM boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-boot-diagnostics
          path: |
            ${{ runner.temp }}/wrtix-vm/guest/console.log
            ${{ runner.temp }}/wrtix-vm/guest/qemu.log
            ${{ runner.temp }}/wrtix-vm/last-command.stderr
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, package, vm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-25.12-apk
          path: artifacts
      - name: Validate release tag
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Attest package, signing key and compatibility metadata
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag "${release_flags[@]}" \
            --title "wrtix $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
